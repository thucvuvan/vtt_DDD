# docker network create vtt-shared-net
networks:
  vtt-net:
    external: true
    name: vtt-shared-net
services:
  mysql:
    image: mysql:8.4
    hostname: mysql
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 2g
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pre_event}
    volumes:
      - "D:/Data/Docker/vtt_volumD:/var/lib/mysql"
    networks:
      - vtt-net
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  redis:
    image: redis:7-alpine
    hostname: redis
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - vtt-net
    ports:
      - "${REDIS_PORT:-6379}:6379"

  orderapi:
    image: orderapi
    hostname: orderapi
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 1g
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      TZ: Asia/Ho_Chi_Minh
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Logging__LogLevel__Default: Debug
      Logging__LogLevel__Application: Debug
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-pre_event};User Id=root;Password=${MYSQL_ROOT_PASSWORD:-changeme};SslMode=None;"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectTimeout=2000"
    volumes:
     - D:/Source Code/anonystick/vtt_DDD/Api/OrderApi/appsettings.json:/app/appsettings.json
     - D:/Source Code/anonystick/vtt_DDD/Api/OrderApi/app.config:/app/OrderApi.dll.config
    ports:
      - "8888:8080"
    networks:
     - vtt-net

  prometheus:
    image: prom/prometheus:v2.55.1
    hostname: prometheus
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    depends_on:
      orderapi:
        condition: service_started
      cadvisor:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - D:/Source Code/anonystick/vtt_DDD/Api/OrderApi/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - D:/Data/Docker/prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - vtt-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    hostname: cadvisor
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    privileged: true
    command:
      - "--housekeeping_interval=10s"
      - "--docker_only=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - D:/Data/Docker/cadvisor_data:/var/lib/cadvisor
    ports:
      - "8081:8080"
    networks:
      - vtt-net

  grafana:
    image: grafana/grafana:11.2.2
    hostname: grafana
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - D:/Source Code/anonystick/vtt_DDD/Api/OrderApi/grafana/provisioning:/etc/grafana/provisioning:ro
      - D:/Data/Docker/grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - vtt-net

